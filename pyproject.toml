[project]
name = "xpipe-to-ssh"
version = "1.2.0"
description = "Convert an XPipe SSH connection into a standalone OpenSSH command."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rich>=15.0.0",
    "xpipe-api>=0.1.34",
]

[project.scripts]
xpipe-to-ssh = "xpipe_to_ssh.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "ty>=0.0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]
